[project]
name = "fixmytutorial"
version = "0.1.0"
description = "Run any coding tutorial, find what broke, fix it with cited evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.50",
  "tavily-python>=0.5",
  "httpx>=0.27",
  "contree-sdk==0.3.6",
  "markdown-it-py>=3.0",
  "selectolax>=0.3.21",
  "pillow>=10.4",
  "huggingface-hub>=0.25",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.2.4",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixmytutorial"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "docker: needs a local Docker daemon",
  "live: calls real Nebius / Tavily APIs (costs credits)",
]
addopts = "-m 'not docker and not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
